name: Publicar Acompañar Salud

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar Angular para GitHub Pages
        run: npm run build -- --base-href /acompanar-salud/
      - name: Preparar directorio publicado
        run: |
          test -f dist/acompanar-salud/browser/index.html
          cp dist/acompanar-salud/browser/index.html dist/acompanar-salud/browser/404.html
          touch dist/acompanar-salud/browser/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/acompanar-salud/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
